name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the pinned Mojo grammar for Pinch
        uses: actions/checkout@v4
        with:
          repository: HerringtonDarkholme/tree-sitter-mojo
          ref: 99fe918e69f087f910ef3b11eba31eb0d7e54edf
          path: .ci/mojo
          persist-credentials: false
      - name: Install trusted parser dependencies
        run: |
          python -m pip install '.[pinch]'
          cc -O2 -fPIC -I.ci/mojo/src -c .ci/mojo/src/parser.c -o "$RUNNER_TEMP/parser.o"
          c++ -O2 -fPIC -I.ci/mojo/src -c .ci/mojo/src/scanner.cc -o "$RUNNER_TEMP/scanner.o"
          c++ -shared "$RUNNER_TEMP/parser.o" "$RUNNER_TEMP/scanner.o" -o "$RUNNER_TEMP/mojo.so"
          echo "CRAB_MOJO_GRAMMAR=$RUNNER_TEMP/mojo.so" >> "$GITHUB_ENV"
      - name: Install pinned source engines
        if: matrix.python == '3.13'
        run: |
          python -m pip install bandit==1.8.6
          curl --fail --location --retry 3 https://github.com/opengrep/opengrep/releases/download/v2.0.0/opengrep_linux_x86 -o "$RUNNER_TEMP/opengrep"
          echo "37e93f4da5fd04a18c5c1febbdd12f7e98dfccd4d0c9cf2593bcb25eeb462da0  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"
          echo "CRAB_OPENGREP=$RUNNER_TEMP/opengrep" >> "$GITHUB_ENV"
      - name: Install infrastructure and secrets engines in isolation
        if: matrix.python == '3.10'
        run: |
          python -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet checkov==3.2.495
          echo "CRAB_CHECKOV=$RUNNER_TEMP/checkov/bin/checkov" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "CRAB_GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/PowerShell/PSScriptAnalyzer/releases/download/1.24.0/PSScriptAnalyzer.1.24.0.nupkg -o "$RUNNER_TEMP/pssa.zip"
          mkdir -p "$HOME/.local/share/powershell/Modules/PSScriptAnalyzer/1.24.0"
          unzip -oq "$RUNNER_TEMP/pssa.zip" -d "$HOME/.local/share/powershell/Modules/PSScriptAnalyzer/1.24.0"
      - name: Install the Syft integration-test version
        uses: anchore/sbom-action/download-syft@fbfd9c6c189226748411491745178e0c2017392d
        id: syft
        with:
          syft-version: v1.32.0
      - run: python -m unittest discover -s tests -v
        env:
          CRAB_TEST_SYFT: ${{ steps.syft.outputs.cmd }}
      - name: Generate example inventory with the installed CLI
        if: matrix.python == '3.13'
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: |
          python -m pip install .
          crab-risk-scan sbom examples/inventory --syft "$SYFT_BIN" --output demo.cdx.json
      - name: Validate installed CLI output against the SARIF 2.1.0 schema
        if: matrix.python == '3.13'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --quiet jsonschema==4.25.1
          curl --fail --location --retry 3 https://raw.githubusercontent.com/oasis-tcs/sarif-spec/1742a253eb654bf8a4ed7c60eaef7412b2c23553/sarif-2.1/schema/sarif-schema-2.1.0.json -o sarif-schema.json
          test -f "$(crab-risk-scan rules)"
          status=0
          crab-risk-scan collect "$GITHUB_WORKSPACE/examples/demo" --trivy "$GITHUB_WORKSPACE/examples/trivy-fs.json" --format sarif > demo.sarif || status=$?
          test "$status" = 1
          python - <<'PY'
          import json
          import jsonschema
          from pathlib import Path
          report = json.loads(Path("demo.sarif").read_text())
          jsonschema.validate(report, json.loads(Path("sarif-schema.json").read_text()))
          assert len(report["runs"][0]["results"]) == 3
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: example-cyclonedx-sbom
          path: demo.cdx.json
          if-no-files-found: error
